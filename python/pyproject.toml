[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promelig"
version = "0.1.0"
description = "Python replacements for the legacy promotion eligibility components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Only needed to run the loader against PostgreSQL; the characterization suite
# uses SQLite from the standard library.
postgres = ["psycopg2-binary>=2.9.9"]

[project.scripts]
promelig-batch = "promelig.batch:main"
promelig-job = "promelig.job:main"
promelig-sql-extract = "promelig.cli_extract:main"
promelig-eligibility = "promelig.cli_web:main"
load-unit-diary = "promelig.unit_diary:main"

[tool.setuptools.packages.find]
include = ["promelig*"]
