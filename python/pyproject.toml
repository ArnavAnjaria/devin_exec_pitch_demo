[project]
name = "promelig"
version = "0.1.0"
description = "Python replacements for the legacy promotion eligibility components"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
promelig-sql-extract = "promelig.cli:main"

[tool.setuptools]
packages = ["promelig"]
