name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: COBOL, Perl, SQL, JCL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install engines
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol libdbd-sqlite3-perl
          python -m pip install --upgrade pip
          pip install pytest pyyaml flake8

      - name: Lint
        run: python -m flake8 tests python

      - name: Run the characterization suites
        run: python -m pytest tests -v

      - name: Fail if a golden file or the generated docs changed
        run: git diff --exit-code tests/golden tests/corpus docs

  java:
    name: Web tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run the web tier suite
        working-directory: java
        run: mvn -B test

      - name: Fail if the golden file changed
        run: git diff --exit-code tests/golden/java.csv
